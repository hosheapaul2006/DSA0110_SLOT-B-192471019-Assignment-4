name: Memory ownership verification
on:
  push:
    paths:
      - '.github/workflows/memory.yml'
      - 'tools/sanitizers.py'
      - 'tools/checks.hpp'
      - 'Task03/**/*.cpp'
      - 'Task03/**/*.hpp'
      - 'Task04/**/*.cpp'
      - 'Task04/**/*.hpp'
      - 'Task05/**/*.cpp'
      - 'Task05/**/*.hpp'
      - 'tools/verify.py'
      - 'Task06/**/*.cpp'
      - 'Task06/**/*.hpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact public repository commit
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Execute and preserve genuine sanitizer evidence
        shell: bash
        run: python3 tools/sanitizers.py
